# =============================================================================
#  Daily outcome recorder
# =============================================================================
#  Runs record_outcomes.py once a day to resolve yesterday's MLB games.
#  Plus an afternoon retry pass to catch West Coast games that finished late.
#
#  Schedule times are in UTC (GitHub Actions does not honor local time).
#
#  Setup checklist (do this once per repo):
#    1. AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets must be set —
#       same least-privilege IAM user used by auto-log-predictions.yml
#       (github-actions-mlb-engine), with secretsmanager:GetSecretValue
#       permission on the RDS master credentials secret. No DATABASE_URL
#       secret is needed anymore — record_outcomes.py fetches RDS
#       credentials live from Secrets Manager.
#    2. Commit this file at .github/workflows/record-outcomes.yml
#    3. Push to main. The workflow appears under the "Actions" tab.
#    4. Click "Run workflow" once manually to verify it works end-to-end
#       before relying on the schedule.
# =============================================================================

name: Record MLB outcomes

on:
  # Manual trigger button in the Actions tab — use this for first-time
  # testing and for backfilling a specific date or date range.
  workflow_dispatch:
    inputs:
      date:
        description: "Single date YYYY-MM-DD (overrides start/end if set)"
        required: false
        type: string
      start_date:
        description: "Backfill range start YYYY-MM-DD (use with end_date)"
        required: false
        type: string
      end_date:
        description: "Backfill range end YYYY-MM-DD (use with start_date)"
        required: false
        type: string
      retry_pending:
        description: "Re-fetch pending/postponed/stuck-player rows (recommended on for manual runs)"
        required: false
        type: boolean
        default: true

# DISABLED — superseded by EventBridge Scheduler + ECS Fargate (Weekend 5).
  # Kept commented rather than deleted as a rollback path. See
  # eventbridge_scheduler.tf for the replacement schedules.
  # schedule:
  #   - cron: "0 13 * * *"
  #   - cron: "0 23 * * *"
  

jobs:
  record:
    name: Resolve outcomes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Job-level AWS credentials — record_outcomes.py's headless path fetches
    # RDS master credentials from Secrets Manager. Scoped tightly in IAM;
    # see mlb-engine-bootstrap-readonly policy.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # boto3 added for the Secrets Manager fetch in record_outcomes.py.
        run: |
          python -m pip install --upgrade pip
          pip install requests sqlalchemy psycopg2-binary boto3

      # ----- Manual: single date (date input takes precedence over range) -----
      - name: Run outcome recorder (manual / single date)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.date != '' }}
        run: |
          python record_outcomes.py --date "${{ inputs.date }}" \
            ${{ inputs.retry_pending && '--retry-pending' || '' }}

      # ----- Manual: explicit date range (backfill use case) -----
      - name: Run outcome recorder (manual / date range)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.date == '' && inputs.start_date != '' && inputs.end_date != '' }}
        run: |
          python record_outcomes.py \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            ${{ inputs.retry_pending && '--retry-pending' || '' }}

      # ----- Manual: no date provided → defaults to yesterday -----
      - name: Run outcome recorder (manual / yesterday)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.date == '' && inputs.start_date == '' && inputs.end_date == '' }}
        run: |
          python record_outcomes.py \
            ${{ inputs.retry_pending && '--retry-pending' || '' }}

      # ----- Scheduled: morning pass for yesterday's finals + any
      #       stuck-pending rows from the previous night's afternoon pass.
      #       --retry-pending is required for the cron to be self-healing:
      #       without it, evening games that the 23:00 UTC pass wrote as
      #       pending will never transition to final.
      - name: Run outcome recorder (morning pass — yesterday's finals)
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 13 * * *' }}
        run: python record_outcomes.py --retry-pending

      # ----- Scheduled: afternoon retry pass -----
      - name: Run outcome recorder (afternoon retry — pending + today)
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 23 * * *' }}
        run: python record_outcomes.py --retry-pending --all-unresolved
